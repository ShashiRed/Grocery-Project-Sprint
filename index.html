<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store - Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Global Navigation Bar (Visible across all pages) -->
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #2c3e50; color: white;">
    <div class="logo" style="font-weight: bold; font-size: 18px;">Grocery Store App</div>
    <div style="display: flex; gap: 20px;">
        <a href="index.html" style="color: white; text-decoration: none;">Products</a>
        <a href="cart.html" style="color: white; text-decoration: none;">Cart</a>
        <a href="profile.html" style="color: white; text-decoration: none;">My Profile</a>
    </div>
</nav>

    <!-- Main Content Container -->
    <div class="container">
        <h1>Available Products</h1>
        <p>Browse our fresh grocery items and add them to your cart.</p>
        
        <!-- Product list grid container -->
        <div id="product-list" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px;">
            <div style="border: 1px solid #ddd; padding: 15px; border-radius: 6px; background: white;">
                <h3>Organic Apples (1kg)</h3>
                <p>Price: ₹150</p>
                <button onclick="addToCart(1)">Add to Cart</button>
            </div>
            <div style="border: 1px solid #ddd; padding: 15px; border-radius: 6px; background: white;">
                <h3>Fresh Whole Milk (1L)</h3>
                <p>Price: ₹65</p>
                <button onclick="addToCart(2)">Add to Cart</button>
            </div>
            <div style="border: 1px solid #ddd; padding: 15px; border-radius: 6px; background: white;">
                <h3>Premium Olive Oil (1L)</h3>
                <p>Price: ₹1250</p>
                <button onclick="addToCart(3)">Add to Cart</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
